<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview Card Source</title>
<!--
  Draws preview.png, the card chat apps show when the sender page's link is
  shared. Not served: open it in a browser, then save the canvas over
  backend/cheers/web/preview.png.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap">
<style>body { margin: 0; background: #ddd; } canvas { display: block; }</style>
</head>
<body>
<canvas id="card" width="1200" height="630"></canvas>
<script>
"use strict";

const CREAM = "#fff3ea", RASPBERRY = "#c81d5a", MUTED = "#7b5a62";

async function draw() {
  await document.fonts.load("60px 'Bagel Fat One'");
  const c = document.getElementById("card").getContext("2d");
  c.fillStyle = CREAM;
  c.fillRect(0, 0, 1200, 630);

  const mark = new Image();
  mark.src = "cheery-wordmark.png";
  await mark.decode();
  const w = 520, h = mark.height * (w / mark.width);
  c.drawImage(mark, (1200 - w) / 2, 66, w, h);

  c.textAlign = "center";
  c.fillStyle = RASPBERRY;
  c.font = "56px 'Bagel Fat One'";
  c.fillText("Record a cheer", 600, 452);
  c.fillStyle = MUTED;
  c.font = "34px 'Bagel Fat One'";
  c.fillText("Graba un mensaje de ánimo", 600, 512);
  c.font = "26px -apple-system, Helvetica, Arial, sans-serif";
  c.fillText("Pick a mile · up to 25 seconds · only the runner hears it", 600, 566);
}

draw();
</script>
</body>
</html>
